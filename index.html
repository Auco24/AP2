<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP2 Trainer – FIAE</title>
  <meta name="description" content="Prüfungsvorbereitung AP2 Fachinformatiker Anwendungsentwicklung">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('ap2.theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <a class="brand" href="#/">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <span class="brand-text"><strong>AP2 Trainer</strong><small>Fachinformatiker AE</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button id="themeToggle" class="nav-item theme-btn" type="button" aria-label="Design umschalten">
          <span class="ico" data-icon="moon"></span><span class="nav-label">Dunkles Design</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <main id="app" class="content" aria-live="polite"></main>
      <footer class="footer">
        Übungsaufgaben im Stil der AP2. Fortschritt wird nur lokal auf diesem Gerät gespeichert.
      </footer>
    </div>
  </div>

  <!-- Daten -->
  <script src="data/categories.js"></script>
  <script src="data/tasks-ga1.js"></script>
  <script src="data/tasks-ga2.js"></script>
  <script src="data/tasks-wiso.js"></script>
  <!-- Aufgaben aus eigenen IHK-Prüfungsunterlagen (lokal, nicht im Git) -->
  <script src="data/ihk/ihk-aufgaben.js"></script>
  <!-- App -->
  <script src="js/icons.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
